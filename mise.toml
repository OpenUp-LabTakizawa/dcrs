[tools]
bun = "latest"
pitchfork = "latest"
rumdl = "latest"

[env]
DATABASE_URL = "postgres://dcrs:dcrs@localhost:5432/dcrs"
DB_TYPE = "postgres"
BETTER_AUTH_SECRET = "local-dev-secret-key-change-in-production"
BETTER_AUTH_URL = "http://localhost:{{ env.WEB_PORT }}"
S3_ACCESS_KEY_ID = "rustfs"
S3_SECRET_ACCESS_KEY = "rustfs123"
S3_REGION = "us-east-1"
S3_BUCKET = "dcrs-dev"
S3_ENDPOINT = "http://localhost:9000"

[tasks."dev:up"]
description = "Start local dev environment"
run = "mise daemons start db"

[tasks."dev:down"]
description = "Stop local dev environment"
run = "mise daemons stop"

[tasks."dev:provision"]
description = "Apply migrations and create the bucket"
run = ["bun run migrate", "mise dev:ensure-bucket"]

[tasks."dev:reset"]
description = "Reset local dev environment (delete volumes)"
run = ["mise daemons stop", "docker compose down -v", "mise run dev:up"]

[tasks."test:e2e"]
description = "Run the Playwright suite against the web daemon"
daemons = ["web"]
run = "bun test:e2e"

[tasks.fix]
run = ["bun fix --unsafe", "mise fix:md"]

[tasks."fix:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

[daemons.db]
run = "docker compose up"
ready_cmd = { run = "mise run dev:provision", timeout = "300s" }
stop_signal = { signal = "SIGTERM", timeout = "30s" }

[daemons.web]
run = "bun dev"
depends = ["db"]
port = 3000
ready_port = { port = 3000, timeout = "60s" }

[deps.bun]
auto = true

[hooks]
enter = ["mise deps -q"]

[settings]
experimental = true
