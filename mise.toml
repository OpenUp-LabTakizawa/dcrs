[tools]
bun = "latest"
pitchfork = "latest"
rumdl = "latest"

# Local development defaults, previously written into `.env` by
# `scripts/dev-up.ts`. They mirror the service definitions in compose.yaml.
# That script is now the `dev:up` task below plus `scripts/ensure-bucket.ts`.
#
# Precedence is deliberate, and `_.file` has to stay above the keys below so
# they can read what it loaded:
#
#   1. an already-exported variable -- a CI workflow's `env:` block
#   2. `.env` -- the Neon / Vercel Blob / Resend credentials from `bun setup`
#   3. the defaults here -- the local Docker stack
#
# Hence `default(value=...)` on every key rather than a plain `KEY = "value"`,
# which makes mise overwrite the parent environment unconditionally and would
# point a remote-mode checkout at a local database that may not be running.
#
# Personal overrides belong in `mise.local.toml`, which is gitignored.
[env]
_.file = { path = ".env", redact = true }
DATABASE_URL = "{{ env.DATABASE_URL | default(value='postgres://dcrs:dcrs@localhost:5432/dcrs') }}"
DB_TYPE = "{{ env.DB_TYPE | default(value='postgres') }}"
BETTER_AUTH_SECRET = "{{ env.BETTER_AUTH_SECRET | default(value='local-dev-secret-key-change-in-production') }}"
BETTER_AUTH_URL = "{{ env.BETTER_AUTH_URL | default(value='http://localhost:3000') }}"
S3_ACCESS_KEY_ID = "{{ env.S3_ACCESS_KEY_ID | default(value='rustfs') }}"
S3_SECRET_ACCESS_KEY = "{{ env.S3_SECRET_ACCESS_KEY | default(value='rustfs123') }}"
S3_REGION = "{{ env.S3_REGION | default(value='us-east-1') }}"
S3_BUCKET = "{{ env.S3_BUCKET | default(value='dcrs-dev') }}"
S3_ENDPOINT = "{{ env.S3_ENDPOINT | default(value='http://localhost:9000') }}"

[tasks."dev:up"]
description = "Start local dev environment"
# The `db` daemon below owns the containers and runs `dev:provision` as its
# readiness check, so this stays the one command that brings the stack up.
run = "mise daemons start db"

[tasks."dev:down"]
description = "Stop local dev environment"
run = "mise daemons stop"

[tasks."dev:provision"]
description = "Apply migrations and create the bucket"
# Each step runs with the [env] table above applied, so `migrate` reads
# DATABASE_URL straight from it. Only the bucket needs an S3 API call.
#
# This is the `db` daemon's ready_cmd, which means it is polled until it
# succeeds rather than run once: both steps are idempotent, so an attempt made
# before PostgreSQL accepts connections costs nothing but the retry.
run = ["bun run migrate", "bun run scripts/ensure-bucket.ts"]

[tasks."dev:reset"]
description = "Reset local dev environment (delete volumes)"
run = ["mise daemons stop", "docker compose down -v", "mise run dev:up"]

[tasks.fix]
run = ["bun fix --unsafe", "mise fix:md"]

[tasks."fix:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

# mise writes the pitchfork config under $MISE_STATE_DIR and registers it, so
# these daemons inherit the [env] table above and see DATABASE_URL and friends.
# `mise daemons` drives pitchfork rather than replacing it, which is why
# pitchfork stays in [tools].

# `docker compose up` stays in the foreground. Backgrounding is the
# supervisor's job, and `-d` would put the containers outside it: stopping the
# daemon would leave them running. Attached, compose handles the SIGTERM
# pitchfork sends and both containers exit 0.
[daemons.db]
run = "docker compose up"
ready_cmd = { run = "mise run dev:provision", timeout = "300s" }
stop_signal = { signal = "SIGTERM", timeout = "30s" }

# `depends` makes `mise daemons start web` bring the database up first and wait
# for the migrations, so there is no separate "start the stack, then the server"
# step to remember.
[daemons.web]
run = "bun dev"
depends = ["db"]
ready_port = { port = 3000, timeout = "60s" }

[deps.bun]
auto = true

[hooks]
enter = ["mise upgrade -q", "mise deps -q"]

[settings]
experimental = true
