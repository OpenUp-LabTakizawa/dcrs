name: 🎭 Playwright Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            artifact: chromium
          - project: firefox
            browser: firefox
            artifact: firefox
          - project: webkit
            browser: webkit
            artifact: webkit
          - project: "Mobile Chrome"
            browser: chromium
            artifact: mobile-chrome
          - project: "Mobile Safari"
            browser: webkit
            artifact: mobile-safari
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🐣 Setup mise
        uses: jdx/mise-action@v4.3.0
        with:
          install_args: bun

      - name: 📦 Install dependencies
        run: bun i

      # Written after `mise-action` ran, so it wins over the development secret
      # in `mise.toml`'s `[env]`, which the action exports into this job.
      - name: 🔑 Generate Better Auth Secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # Bring up PostgreSQL and RustFS from the same compose.yaml the local
      # stack uses, so the credentials live in one place. Service containers
      # start before any step runs, which is why they could never read what
      # `mise-action` exports and had to restate every value. `--wait` blocks
      # until both healthchecks pass.
      - name: 🐳 Start PostgreSQL + RustFS
        run: docker compose up -d --wait

      # What the `db` daemon runs locally as its readiness check: migrations,
      # then the bucket. Both read DATABASE_URL and the S3_* values from mise.
      - name: 🪣 Apply migrations and create the bucket
        run: mise run dev:provision

      - name: 🧩 Build app
        run: bun run build

      - name: 🎭 Install Playwright Browsers
        run: bun playwright install --with-deps ${{ matrix.browser }}

      - name: 🧪 Run Playwright tests
        run: bun playwright test --project="${{ matrix.project }}" --project="${{ matrix.project }}-auth"

      - name: 🆙 Upload Test Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 30

      - name: 🛑 Stop containers
        if: always()
        run: docker compose down -v
